# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive advisories we cannot fix without upstream updates. Each entry
# documents an explicit review-by date and tracking issue so a stale ignore
# can't quietly outlive its upstream fix.
#
# RUSTSEC-2025-0134 (rustls-pemfile unmaintained) was resolved by upgrading
# tonic 0.12 → 0.14 (which uses rustls-pki-types directly).
ignore = []

[licenses]
version = 2
# Grimoire itself is dual-licensed `MIT OR Apache-2.0` (see Cargo.toml + the
# top-level LICENSE-MIT / LICENSE-APACHE files). The `allow` list below governs
# what transitive dependency licenses we accept — it is intentionally broader
# than the project's own license, because real-world permissive Rust crates ship
# under a small zoo of compatible licenses.
allow = [
    # Project license — both halves of our MIT OR Apache-2.0 dual.
    "MIT",
    "Apache-2.0",
    # Apache-2.0 with the LLVM exception — used by `rustix`, `linux-raw-sys`,
    # `wasi`/`wasip2`/`wasip3`, `wit-bindgen`, `blake3`.
    "Apache-2.0 WITH LLVM-exception",
    # Permissive BSD variants — `arrayref`, `zerocopy` (BSD-2); `matchit`,
    # `subtle` (BSD-3).
    "BSD-2-Clause",
    "BSD-3-Clause",
    # ISC — `ring`, `rustls`, `rustls-webpki`, `inotify`, `untrusted`.
    "ISC",
    # Unicode-3.0 — `unicode-ident` (Unicode license data).
    "Unicode-3.0",
    # MPL-2.0 (weak file-level copyleft, no link-time obligations) — `colored`,
    # `option-ext`.
    "MPL-2.0",
    # CC0-1.0 (public-domain dedication) — `notify` (single-licensed under CC0).
    "CC0-1.0",
    # Zlib license — `foldhash` (pulled in by `hashbrown` 0.16+, which tonic
    # 0.14's transitive deps require). Permissive, OSI-approved.
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Crates we never want pulled in.
deny = [
    # { crate = "openssl", reason = "prefer rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
