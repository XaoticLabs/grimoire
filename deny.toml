# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive advisories we cannot fix without upstream updates. Re-evaluate
# whenever `tonic` and `axum` are upgraded.
ignore = [
    # rustls-pemfile is unmaintained but still safe; pulled in via tonic 0.12.
    # Resolved when we move to tonic 0.13+ (which uses rustls-pki-types directly).
    "RUSTSEC-2025-0134",
]

[licenses]
version = 2
# Permissive licenses acceptable for a Rust binary distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Crates we never want pulled in.
deny = [
    # { crate = "openssl", reason = "prefer rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
