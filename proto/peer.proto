syntax = "proto3";
package grimoire.peer.v1;

// Federation peer protocol.

service Peer { rpc Channel(stream PeerOutbound) returns (stream PeerInbound); }

message Hello {
  string daemon_id = 1;
  uint32 protocol_version = 2;
  string bearer_token = 3;
  repeated string advertised_topics = 4;
}

message HelloAck {
  string daemon_id = 1;
  uint32 protocol_version = 2;
  bool accepted = 3;
  string reject_reason = 4;
}

message Heartbeat { uint64 nonce = 1; }

message HeartbeatAck { uint64 nonce = 1; }

message MailDeliver {
  string mail_id = 1;
  string sender = 2;
  string recipient = 3;
  string body = 4;
  optional string topic = 5;
  uint64 sender_seq = 6;
}

message MailAck {
  string mail_id = 1;
  bool ok = 2;
  string reason = 3;
}

message TopicSubscribe {
  string topic = 1;
  string subscriber_address = 2;
}

message TopicUnsubscribe {
  string topic = 1;
  string subscriber_address = 2;
}

message Goodbye { string reason = 1; }

message MemoryDeliver {
  string op_id = 1; // correlation handle for the ack
  string namespace = 2;
  string key = 3;
  bytes value = 4;
  uint64 lamport = 5;
  string origin_daemon_id = 6;
  bool deleted = 7; // tombstone
  string updated_by = 8;
}

message MemoryAck {
  string op_id = 1;
  bool ok = 2;
  string reason = 3;
}

// F3b: workspace file-event federation. `payload_json` is the wire-
// shape of a `WorkspaceFileChanged` batch — paths + kinds + truncated
// count. The receiver dedupes by (sender_daemon_id, sender_seq) and
// republishes locally on the shadow workspace.
message WorkspaceEventDeliver {
  string workspace_id = 1;
  uint64 sender_seq = 2;
  string payload_json = 3;
}

message WorkspaceEventAck {
  uint64 sender_seq = 1;
  bool ok = 2;
  string reason = 3;
}

// F4b: agent lifecycle federation. `payload_json` carries the
// `RemoteAgentStateChanged`-shape body — agent_id + new_state +
// optional metadata. Receiver dedupes by (sender_daemon_id,
// sender_seq) and republishes locally as a `RemoteAgentStateChanged`
// stream event so wake sources and dashboards can react.
message AgentLifecycleDeliver {
  uint64 sender_seq = 1;
  string payload_json = 2;
}

message AgentLifecycleAck {
  uint64 sender_seq = 1;
  bool ok = 2;
  string reason = 3;
}

// F5a: cross-peer scroll task dispatch. The coordinator ships one
// task spec; the receiver queues a local agent (in its own scheduler)
// and acks with the assigned `local_agent_id`. Lifecycle of that
// agent flows back via F4b `AgentLifecycleDeliver`, which is how the
// coordinator learns the task completed.
message ScrollTaskDispatch {
  uint64 sender_seq = 1;
  string scroll_id = 2;
  string task_id = 3;
  string task_name = 4;
  string prompt = 5;
  string provider = 6;
  string model = 7;
  string cwd = 8;
  repeated string file_patterns = 9;
}

message ScrollTaskDispatchAck {
  uint64 sender_seq = 1;
  bool ok = 2;
  string reason = 3;
  // Filled when `ok=true`; the receiver's local agent id for the
  // dispatched task. Coordinator stores it on the
  // `scroll_task_dispatches` row so lifecycle events can be matched
  // back to the originating task.
  string local_agent_id = 4;
  // Echo back so the coordinator can look up the dispatch row
  // without keeping a per-flight side-table.
  string scroll_id = 5;
  string task_id = 6;
}

message PeerOutbound {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    HeartbeatAck heartbeat_ack = 3;
    MailDeliver mail_deliver = 4;
    MailAck mail_ack = 5;
    TopicSubscribe topic_subscribe = 6;
    TopicUnsubscribe topic_unsubscribe = 7;
    Goodbye goodbye = 8;
    HelloAck hello_ack = 9;
    MemoryDeliver memory_deliver = 10;
    MemoryAck memory_ack = 11;
    WorkspaceEventDeliver workspace_event_deliver = 12;
    WorkspaceEventAck workspace_event_ack = 13;
    AgentLifecycleDeliver agent_lifecycle_deliver = 14;
    AgentLifecycleAck agent_lifecycle_ack = 15;
    ScrollTaskDispatch scroll_task_dispatch = 16;
    ScrollTaskDispatchAck scroll_task_dispatch_ack = 17;
  }
}

message PeerInbound {
  oneof msg {
    HelloAck hello_ack = 1;
    Heartbeat heartbeat = 2;
    HeartbeatAck heartbeat_ack = 3;
    MailDeliver mail_deliver = 4;
    MailAck mail_ack = 5;
    TopicSubscribe topic_subscribe = 6;
    TopicUnsubscribe topic_unsubscribe = 7;
    Goodbye goodbye = 8;
    MemoryDeliver memory_deliver = 10;
    MemoryAck memory_ack = 11;
    WorkspaceEventDeliver workspace_event_deliver = 12;
    WorkspaceEventAck workspace_event_ack = 13;
    AgentLifecycleDeliver agent_lifecycle_deliver = 14;
    AgentLifecycleAck agent_lifecycle_ack = 15;
    ScrollTaskDispatch scroll_task_dispatch = 16;
    ScrollTaskDispatchAck scroll_task_dispatch_ack = 17;
  }
}
