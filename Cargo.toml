[package]
name = "grimoire"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Agent orchestration daemon: summon, chain, schedule, federate, and supervise LLM agents over UDS/HTTP/gRPC."
repository = "https://github.com/XaoticLabs/grimoire"
homepage = "https://github.com/XaoticLabs/grimoire"
readme = "README.md"
# Not published to crates.io (the `grimoire` name is taken by an unrelated
# crate). Install from source; see the README.
publish = false

[package.metadata.cargo-machete]
ignored = ["tonic-prost"]

[[bin]]
name = "grim"
path = "src/main.rs"

[[bin]]
name = "grimw"
path = "src/grimw/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
directories = "6"
colored = "3"
nix = { version = "0.31", features = ["signal", "process", "user"] }
async-stream = "0.3"
async-trait = "0.1"
toml = "1.1.2"
tonic = { version = "0.14", features = ["tls-ring", "router"] }
tonic-prost = "0.14"
prost = "0.14"
semver = "1"
blake3 = "1"
rcgen = "0.13"
ring = "0.17"
subtle = "2"
tempfile = "3"
parking_lot = "0.12"
futures = "0.3"
cron = "0.16"
notify = "6"
globset = "0.4"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "ring", "tls12"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
debug = "line-tables-only"
opt-level = 1

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
warnings = { level = "deny", priority = -1 }
dead_code = "allow"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
significant_drop_tightening      = "allow"
significant_drop_in_scrutinee    = "allow"
option_if_let_else               = "allow"
too_long_first_doc_paragraph     = "allow"
literal_string_with_formatting_args = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown       = "allow"
must_use_candidate    = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
unused_async           = "allow"
unnecessary_wraps      = "allow"
dbg_macro    = "warn"
todo         = "warn"
print_stdout = "warn"
print_stderr = "warn"
rc_buffer    = "warn"
