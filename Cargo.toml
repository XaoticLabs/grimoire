[package]
name = "grimoire"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "grim"
path = "src/main.rs"

[[bin]]
name = "grimw"
path = "src/grimw/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Web server
axum = { version = "0.8", features = ["ws"] }
tokio-stream = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
directories = "6"
colored = "3"
nix = { version = "0.29", features = ["signal", "process"] }
async-stream = "0.3"
async-trait = "0.1"
toml = "1.1.2"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
semver = "1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
