# Dependabot configuration.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Cargo dependency updates. Grouped so the bot opens one PR per cadence
  # instead of fragmenting across crates — easier to review and matches the
  # `--locked` review workflow.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      tonic-stack:
        patterns:
          - "tonic*"
          - "prost*"
          - "tonic-prost*"
      hyper-stack:
        patterns:
          - "hyper"
          - "hyper-*"
          - "http-body-util"
      rustls-stack:
        patterns:
          - "rustls*"
          - "tokio-rustls"
          - "ring"
      tokio-stack:
        patterns:
          - "tokio"
          - "tokio-*"
          - "tracing"
          - "tracing-*"
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions are pinned by full commit SHA (see .github/workflows/*).
  # Dependabot reads the `# vX.Y.Z` comment next to each SHA and bumps both
  # the pin and the comment in lockstep.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
