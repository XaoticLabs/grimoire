<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire - Agent Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #6a6a7a;
            --accent: #7c5cbf;
            --green: #4ade80;
            --yellow: #fbbf24;
            --red: #f87171;
            --blue: #60a5fa;
            --purple: #a78bfa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 600;
        }

        header .status {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-left: auto;
        }

        header .status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 0.4rem;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        #agents {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .agent-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: grid;
            grid-template-columns: 80px 120px 1fr 80px;
            align-items: center;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .agent-card:hover {
            border-color: var(--accent);
        }

        .agent-id {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .agent-state {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-align: center;
        }

        .state-summoning { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .state-active { background: rgba(74, 222, 128, 0.15); color: var(--green); }
        .state-complete { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
        .state-failed { background: rgba(248, 113, 113, 0.15); color: var(--red); }
        .state-banished { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

        .agent-task {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .agent-age {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-align: right;
        }

        .empty {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
        }

        .empty .icon { font-size: 2rem; margin-bottom: 1rem; }

        #event-log {
            margin-top: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.8rem;
        }

        .event-line {
            padding: 0.2rem 0;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .event-line .timestamp {
            color: var(--text-dim);
            margin-right: 0.5rem;
        }

        .event-line.stdout { color: var(--text); }
        .event-line.stderr { color: var(--yellow); }
        .event-line.state-change { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <h1>grimoire</h1>
        <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting...</span></span>
    </header>

    <main>
        <div class="section-title">Agents in the Circle</div>
        <div id="agents">
            <div class="empty">
                <div class="icon">&#x2728;</div>
                <div>No agents summoned yet</div>
            </div>
        </div>

        <div class="section-title" style="margin-top: 2rem;">Live Events</div>
        <div id="event-log"></div>
    </main>

    <script>
        const agentsEl = document.getElementById('agents');
        const eventLog = document.getElementById('event-log');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function formatAge(secs) {
            if (secs < 60) return secs + 's';
            if (secs < 3600) return Math.floor(secs / 60) + 'm';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h';
            return Math.floor(secs / 86400) + 'd';
        }

        function renderAgents(agents) {
            if (!agents.length) {
                agentsEl.innerHTML = '<div class="empty"><div class="icon">&#x2728;</div><div>No agents summoned yet</div></div>';
                return;
            }
            agentsEl.innerHTML = agents.map(a => `
                <div class="agent-card">
                    <span class="agent-id">${a.id}</span>
                    <span class="agent-state state-${a.state}">${a.state}</span>
                    <span class="agent-task">${a.task || '-'}</span>
                    <span class="agent-age">${formatAge(a.age_secs)}</span>
                </div>
            `).join('');
        }

        function addEvent(text, cls) {
            const line = document.createElement('div');
            line.className = 'event-line ' + (cls || '');
            const time = new Date().toLocaleTimeString();
            line.innerHTML = `<span class="timestamp">${time}</span>${text}`;
            eventLog.appendChild(line);
            eventLog.scrollTop = eventLog.scrollHeight;

            // Keep max 500 lines
            while (eventLog.children.length > 500) {
                eventLog.removeChild(eventLog.firstChild);
            }
        }

        // Fetch agents periodically
        async function fetchAgents() {
            try {
                const res = await fetch('/api/agents');
                const data = await res.json();
                renderAgents(data.agents || []);
            } catch (e) {
                console.error('Failed to fetch agents:', e);
            }
        }

        // SSE for live events
        function connectSSE() {
            const es = new EventSource('/api/events');

            es.onopen = () => {
                statusDot.style.background = 'var(--green)';
                statusText.textContent = 'connected';
            };

            es.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    switch (event.type) {
                        case 'output':
                            addEvent(`[${event.agent_id}] ${event.line}`, event.stream);
                            break;
                        case 'state_change':
                            addEvent(`Agent ${event.agent_id}: ${event.old_state} → ${event.new_state}`, 'state-change');
                            fetchAgents();
                            break;
                        case 'agent_created':
                            addEvent(`Agent ${event.agent.id} summoned: ${event.agent.task || ''}`, 'state-change');
                            fetchAgents();
                            break;
                    }
                } catch (err) {
                    console.error('SSE parse error:', err);
                }
            };

            es.onerror = () => {
                statusDot.style.background = 'var(--red)';
                statusText.textContent = 'disconnected';
                es.close();
                setTimeout(connectSSE, 3000);
            };
        }

        fetchAgents();
        setInterval(fetchAgents, 5000);
        connectSSE();
    </script>
</body>
</html>
