<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire - Agent Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-dim: #6a6a7a;
            --accent: #7c5cbf;
            --green: #4ade80;
            --yellow: #fbbf24;
            --red: #f87171;
            --blue: #60a5fa;
            --purple: #a78bfa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 { font-size: 1.4rem; color: var(--accent); font-weight: 600; cursor: pointer; }
        header .breadcrumb { font-size: 0.9rem; color: var(--text-dim); }

        header .status {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-left: auto;
        }

        header .status .dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 0.4rem;
        }

        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 1rem;
        }

        /* Forms */
        .form-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }

        .form-row input[type="text"] {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-row input:focus { border-color: var(--accent); }
        .form-row input::placeholder { color: var(--text-dim); }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-danger { background: var(--red); }
        .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.8rem; }

        /* Agent list */
        #agents { display: flex; flex-direction: column; gap: 0.5rem; }

        .agent-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .agent-card:hover { border-color: var(--accent); }

        .agent-card-top {
            display: grid;
            grid-template-columns: 80px 100px 1fr 80px;
            align-items: center;
            gap: 1rem;
        }

        .agent-id { font-size: 0.85rem; color: var(--text-dim); }

        .agent-state {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-align: center;
        }

        .state-summoning { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .state-active { background: rgba(74, 222, 128, 0.15); color: var(--green); }
        .state-complete { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
        .state-failed { background: rgba(248, 113, 113, 0.15); color: var(--red); }
        .state-banished { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

        .agent-task { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .agent-age { font-size: 0.8rem; color: var(--text-dim); text-align: right; }

        .agent-card-live {
            margin-top: 0.6rem;
            padding-top: 0.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-dim);
            max-height: 60px;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .agent-card-live .live-label {
            font-size: 0.7rem;
            color: var(--green);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.2rem;
        }

        .empty { text-align: center; padding: 4rem; color: var(--text-dim); }
        .empty .icon { font-size: 2rem; margin-bottom: 1rem; }

        /* Detail view */
        #detail-view { display: none; }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .detail-header .back {
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .detail-header .back:hover { color: var(--text); }
        .detail-header .info { flex: 1; }

        .detail-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .detail-meta span { display: flex; align-items: center; gap: 0.3rem; }
        .detail-actions { display: flex; gap: 0.5rem; }

        /* Stream output */
        #agent-output {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            max-height: calc(100vh - 380px);
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .ev-init { color: var(--accent); padding: 0.3rem 0; border-bottom: 1px solid var(--border); margin-bottom: 0.8rem; }
        .ev-text { color: var(--text); white-space: pre-wrap; word-break: break-word; }

        .ev-tool {
            margin: 0.6rem 0;
            padding: 0.6rem 0.8rem;
            background: var(--surface2);
            border-radius: 6px;
            border-left: 3px solid var(--yellow);
        }

        .ev-tool .tool-name { color: var(--yellow); font-weight: 600; }
        .ev-tool .tool-param { color: var(--text-dim); font-size: 0.8rem; margin-top: 0.2rem; }

        .ev-tool-result {
            margin: 0.3rem 0 0.6rem 0;
            padding: 0.4rem 0.8rem;
            background: var(--surface2);
            border-radius: 6px;
            border-left: 3px solid var(--green);
            font-size: 0.8rem;
            color: var(--text-dim);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .ev-tool-result.error { border-left-color: var(--red); color: var(--red); }

        .ev-result { margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 0.8rem; }
        .ev-result .success { color: var(--green); }
        .ev-result .failure { color: var(--red); }
        .ev-result .meta { color: var(--text-dim); margin-left: 0.5rem; }

        #invoke-section { margin-top: 1.5rem; }

        /* Nav */
        nav.tabs {
            display: flex;
            gap: 0.25rem;
            padding: 0 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            overflow-x: auto;
        }
        nav.tabs a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.7rem 1rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: color 0.15s, border-color 0.15s;
        }
        nav.tabs a:hover { color: var(--text); }
        nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Generic table styling for new pages */
        .grid-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .grid-table th {
            text-align: left;
            font-weight: 500;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .grid-table td {
            padding: 0.7rem 0.75rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        .grid-table tr:hover td { background: var(--surface); }
        .grid-table .actions { text-align: right; white-space: nowrap; }
        .grid-table .muted { color: var(--text-dim); }
        .grid-table code {
            font-family: inherit;
            background: var(--surface);
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: 0.8rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 0.6rem 1rem;
            align-items: center;
        }
        .form-grid label { font-size: 0.8rem; color: var(--text-dim); }
        .form-grid input, .form-grid select, .form-grid textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
            color: var(--text);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }
        .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
            border-color: var(--accent);
        }
        .form-grid .form-actions {
            grid-column: 2;
            display: flex;
            gap: 0.5rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.7rem 1.2rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(0.5rem);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            max-width: 28rem;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.err { border-color: var(--red); color: var(--red); }
        .toast.ok { border-color: var(--green); color: var(--green); }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 3px;
            font-size: 0.7rem;
            background: var(--surface2);
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-cron { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
        .badge-file { background: rgba(74, 222, 128, 0.15); color: var(--green); }
        .badge-mail { background: rgba(167, 139, 250, 0.15); color: var(--purple); }
        .badge-parent { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
        .badge-local { background: rgba(74, 222, 128, 0.15); color: var(--green); }
        .badge-shadow { background: rgba(167, 139, 250, 0.15); color: var(--purple); }

        /* Modal */
        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            min-width: 32rem;
            max-width: 60rem;
            max-height: 80vh;
            overflow: auto;
        }
        .modal h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 1rem;
            font-weight: 500;
        }
        .modal pre {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 50vh;
            overflow: auto;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 onclick="location.hash='#/agents'">grimoire</h1>
        <span class="breadcrumb" id="breadcrumb"></span>
        <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">connecting...</span></span>
    </header>
    <nav class="tabs" id="tabs">
        <a href="#/agents" data-route="agents">Agents</a>
        <a href="#/wake" data-route="wake">Wake</a>
        <a href="#/workspaces" data-route="workspaces">Workspaces</a>
        <a href="#/mail" data-route="mail">Mail</a>
        <a href="#/scrolls" data-route="scrolls">Scrolls</a>
        <a href="#/health" data-route="health">Health</a>
        <a href="#/federation" data-route="federation">Federation</a>
        <a href="#/chronicle" data-route="chronicle">Chronicle</a>
        <a href="#/webhooks" data-route="webhooks">Webhooks</a>
    </nav>

    <main>
        <!-- Page: Agents (list + detail) -->
        <div data-page="agents">
        <div id="list-view">
            <div class="section-title">Summon Agent</div>
            <div class="form-row">
                <input type="text" id="summon-input" placeholder="Enter a task for the agent..." onkeydown="if(event.key==='Enter')doSummon()">
                <button class="btn" onclick="doSummon()" id="summon-btn">Summon</button>
            </div>

            <div class="section-title">Agents in the Circle</div>
            <div id="agents">
                <div class="empty"><div class="icon">&#x2728;</div><div>No agents summoned yet</div></div>
            </div>
        </div>

        <div id="detail-view">
            <div class="detail-header">
                <span class="back" onclick="showList()">&larr;</span>
                <div class="info">
                    <div id="detail-title" style="font-weight: 600;"></div>
                    <div class="detail-meta" id="detail-meta"></div>
                </div>
                <div class="detail-actions" id="detail-actions"></div>
            </div>
            <div class="section-title">Agent Output</div>
            <div id="agent-output"></div>

            <div id="invoke-section" style="display:none;">
                <div class="section-title" style="margin-top:1.5rem;">Invoke</div>
                <div class="form-row">
                    <input type="text" id="invoke-input" placeholder="Send a follow-up message..." onkeydown="if(event.key==='Enter')doInvoke()">
                    <button class="btn" onclick="doInvoke()" id="invoke-btn">Invoke</button>
                </div>
            </div>
        </div>
        </div><!-- /page agents -->

        <div data-page="wake" hidden></div>
        <div data-page="workspaces" hidden></div>
        <div data-page="mail" hidden></div>
        <div data-page="scrolls" hidden></div>
        <div data-page="health" hidden></div>
        <div data-page="federation" hidden></div>
        <div data-page="chronicle" hidden></div>
        <div data-page="webhooks" hidden></div>
    </main>
    <div class="toast" id="toast"></div>
    <div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>

    <script>
        // --- RPC bridge ---------------------------------------------------
        // Single client-side door to every CLI-equivalent daemon method.
        // Server-side: POST /api/rpc → handle_rpc dispatcher.
        async function grim(method, params) {
            const res = await fetch('/api/rpc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ method, params: params || {}, id: Date.now() & 0xffffffff }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const env = await res.json();
            if (env.error) throw new Error(env.error.message || JSON.stringify(env.error));
            return env.result;
        }

        // --- Toast --------------------------------------------------------
        function toast(msg, kind) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (kind || '');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { t.className = 'toast ' + (kind || ''); }, 3000);
        }

        // --- Router -------------------------------------------------------
        // Hash routes drive which <div data-page="…"> is visible. Each route
        // calls its render function which fills its page container.
        const routes = {
            agents:     { render: renderAgentsPage,     refresh: fetchAgents },
            wake:       { render: renderWakePage,       refresh: refreshWake },
            workspaces: { render: renderWorkspacesPage },
            mail:       { render: renderMailPage },
            scrolls:    { render: renderScrollsPage },
            health:     { render: renderHealthPage },
            federation: { render: renderFederationPage },
            chronicle:  { render: renderChroniclePage },
            webhooks:   { render: renderWebhooksPage },
        };

        function parseHash() {
            const h = (location.hash || '#/agents').replace(/^#\/?/, '');
            const [name, ...rest] = h.split('/');
            return { name: routes[name] ? name : 'agents', rest };
        }

        function route() {
            const { name, rest } = parseHash();
            for (const el of document.querySelectorAll('[data-page]')) {
                el.hidden = el.dataset.page !== name;
            }
            for (const a of document.querySelectorAll('nav.tabs a')) {
                a.classList.toggle('active', a.dataset.route === name);
            }
            const r = routes[name];
            if (r && r.render) r.render(rest);
        }

        function renderStubPage(name) {
            return function() {
                const el = document.querySelector(`[data-page="${name}"]`);
                if (el.dataset.rendered) return;
                el.innerHTML = `<div class="empty"><div class="icon">&#x2728;</div><div>${name} page — coming next</div></div>`;
                el.dataset.rendered = '1';
            };
        }

        // Agents page is rendered ambiently by the existing list/detail JS
        // below; this hook decides whether to show the detail view for a
        // specific agent based on the hash (e.g. #/agents/abc123).
        function renderAgentsPage(rest) {
            const id = rest && rest[0];
            if (id) {
                showAgent(id);
            } else if (currentAgentId) {
                showList();
            } else {
                fetchAgents();
            }
        }

        window.addEventListener('hashchange', route);

        // --- Wake Sources page -------------------------------------------
        // Wake sources attach a trigger (cron / file_watch / parent_completion)
        // to an *existing* agent. Backend protocol: `wake.add` expects
        //   { agent_id, kind, config }
        // where `config` is kind-specific JSON (mirrors the CLI in
        // src/cli/commands/wake.rs).
        function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }

        async function refreshWake() {
            const tbody = document.getElementById('wake-tbody');
            if (!tbody) return;
            try {
                const result = await grim('wake.list', {});
                renderWakeTable(result.sources || []);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="muted">wake.list failed: ${esc(e.message)}</td></tr>`;
            }
        }

        async function refreshWakeAgentOptions() {
            const sel = document.getElementById('wake-agent');
            if (!sel) return;
            try {
                const result = await grim('agent.circle', {});
                const agents = result.agents || [];
                const cur = sel.value;
                sel.innerHTML = agents.length
                    ? agents.map(a => `<option value="${escAttr(a.id)}">${esc(a.id)} — ${esc((a.task || '').slice(0, 60))}</option>`).join('')
                    : `<option value="">no agents — summon one from the Agents tab first</option>`;
                if (cur && agents.some(a => a.id === cur)) sel.value = cur;
            } catch (e) {
                sel.innerHTML = `<option value="">agent.circle failed: ${esc(e.message)}</option>`;
            }
        }

        function wakeKindBadge(kind) {
            const cls = {
                cron: 'badge-cron',
                file_watch: 'badge-file',
                parent_completion: 'badge-parent',
            }[kind] || '';
            return `<span class="badge ${cls}">${esc(kind)}</span>`;
        }

        function wakeStateColor(state) {
            return {
                armed: 'var(--green)',
                failed: 'var(--red)',
                disabled: 'var(--text-dim)',
            }[state] || 'var(--text-dim)';
        }

        function renderWakeTable(sources) {
            const tbody = document.getElementById('wake-tbody');
            if (!tbody) return;
            if (!sources.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem">no wake sources yet — add one above</td></tr>`;
                return;
            }
            tbody.innerHTML = sources.map(s => {
                const cfg = (s.config_json || '').slice(0, 60);
                const last = s.last_fired_at
                    ? new Date(s.last_fired_at * 1000).toLocaleString()
                    : '—';
                return `
                    <tr>
                        <td><code>${esc(s.id || '')}</code></td>
                        <td>${wakeKindBadge(s.kind || '')}</td>
                        <td><code>${esc((s.agent_id || '').slice(0, 12))}</code></td>
                        <td><code>${esc(cfg)}</code></td>
                        <td>
                            <span style="color:${wakeStateColor(s.state)}">${esc(s.state || '')}</span>
                            <span class="muted"> · ${s.fire_count || 0} fires</span>
                            <div class="muted" style="font-size:0.75rem">${esc(last)}</div>
                            ${s.fail_reason ? `<div style="color:var(--red);font-size:0.75rem">${esc(s.fail_reason)}</div>` : ''}
                        </td>
                        <td class="actions">
                            <button class="btn btn-sm" onclick="testWake('${escAttr(s.id)}')">Test</button>
                            <button class="btn btn-sm btn-danger" onclick="removeWake('${escAttr(s.id)}')">Remove</button>
                        </td>
                    </tr>`;
            }).join('');
        }

        async function testWake(wake_id) {
            try {
                const r = await grim('wake.test', { wake_id });
                toast('fired · mail ' + (r?.mail_id || ''), 'ok');
                refreshWake();
            } catch (e) {
                toast('wake.test failed: ' + e.message, 'err');
            }
        }

        async function removeWake(wake_id) {
            if (!confirm(`Remove wake source ${wake_id}?`)) return;
            try {
                await grim('wake.remove', { wake_id });
                toast('removed', 'ok');
                refreshWake();
            } catch (e) {
                toast('wake.remove failed: ' + e.message, 'err');
            }
        }

        function updateWakeFormFields() {
            const kind = document.getElementById('wake-kind').value;
            for (const row of document.querySelectorAll('.wake-field')) {
                row.hidden = !row.dataset.kinds.split(',').includes(kind);
            }
        }

        async function submitWake() {
            const agent_id = document.getElementById('wake-agent').value;
            const kind = document.getElementById('wake-kind').value;
            if (!agent_id) { toast('select an agent first', 'err'); return; }
            let config;
            if (kind === 'cron') {
                const expr = document.getElementById('wake-cron').value.trim();
                if (!expr) { toast('cron expr is required', 'err'); return; }
                config = { expr };
            } else if (kind === 'file_watch') {
                const globs = document.getElementById('wake-globs').value
                    .split(/\s+/).filter(Boolean);
                const ignore = document.getElementById('wake-ignore').value
                    .split(/\s+/).filter(Boolean);
                const root = document.getElementById('wake-root').value.trim();
                if (!globs.length) { toast('at least one glob is required', 'err'); return; }
                if (!root) { toast('root path is required', 'err'); return; }
                config = { globs, ignore, root };
            } else if (kind === 'parent_completion') {
                const parent_id = document.getElementById('wake-parent').value.trim();
                const states = document.getElementById('wake-states').value
                    .split(',').map(s => s.trim()).filter(Boolean);
                if (!parent_id) { toast('parent agent id is required', 'err'); return; }
                config = { parent_id, states: states.length ? states : ['complete'] };
            }
            try {
                const r = await grim('wake.add', { agent_id, kind, config });
                toast('added ' + (r?.wake_id || ''), 'ok');
                refreshWake();
            } catch (e) {
                toast('wake.add failed: ' + e.message, 'err');
            }
        }

        // --- Modal helpers -----------------------------------------------

            const m = document.getElementById('modal');

            document.getElementById('modal-backdrop').classList.add('show');

        // --- Workspaces + Memory page ------------------------------------
        // Workspaces are git worktrees with a per-workspace shared KV store.
        // RPC surface: workspace.list/create/destroy/assign + memory.list/get/put/delete.
        let currentWorkspaceId = null;

        async function refreshWorkspaces() {
            const tbody = document.getElementById('ws-tbody');
            if (!tbody) return;
            try {
                const result = await grim('workspace.list', { include_orphans: true });
                renderWorkspacesTable(result.workspaces || [], result.orphans || []);

                tbody.innerHTML = `<tr><td colspan="6" class="muted">workspace.list failed: ${esc(e.message)}</td></tr>`;

        function workspaceKindBadge(kind) {
            const cls = kind === 'Shadow' ? 'badge-shadow' : 'badge-local';
            return `<span class="badge ${cls}">${esc(kind || 'Local')}</span>`;
        }

        function renderWorkspacesTable(workspaces, orphans) {
            const tbody = document.getElementById('ws-tbody');
            if (!tbody) return;
            if (!workspaces.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem">no workspaces yet — create one above</td></tr>`;
            } else {

        async function submitWorkspaceCreate() {
            const name = document.getElementById('ws-name').value.trim();

            try {
                const r = await grim('workspace.create', { name, repo_path, branch });
                toast('created ' + (r?.id || ''), 'ok');
                document.getElementById('ws-name').value = '';
                refreshWorkspaces();
            } catch (e) {
                toast('workspace.create failed: ' + e.message, 'err');

        async function destroyWorkspace(id) {
            if (!confirm(`Destroy workspace ${id}? This removes the worktree.`)) return;
            try {
                await grim('workspace.destroy', { id });
                toast('destroyed', 'ok');
                refreshWorkspaces();
            } catch (e) {
                toast('workspace.destroy failed: ' + e.message, 'err');
            }
        }

        async function confirmAssign(workspace_id) {
            const agent_id = document.getElementById('assign-agent').value;
            if (!agent_id) { toast('no agent selected', 'err'); return; }
            try {
                await grim('workspace.assign', { workspace_id, agent_id });

        async function openWorkspaceMemory(workspace_id) {
            currentWorkspaceId = workspace_id;
            openModal(`
                <h2>Memory · ${esc(workspace_id)}</h2>

                <div class="modal-actions"><button class="btn btn-sm" style="background:var(--surface2);color:var(--text)" onclick="closeModal()">Close</button></div>

        async function memList() {
            const prefix = document.getElementById('mem-prefix').value.trim();
            const params = { workspace_id: currentWorkspaceId };
            if (prefix) params.prefix = prefix;
            try {
                const r = await grim('memory.list', params);
                const entries = r.entries || [];
                const tbody = document.getElementById('mem-tbody');
                tbody.innerHTML = entries.length
                    ? entries.map(e => `
                        <tr onclick="document.getElementById('mem-key').value='${escAttr(e.key)}'; memGet()" style="cursor:pointer">
                            <td><code>${esc(e.key)}</code></td>
                            <td>${e.version}</td>
                            <td class="muted">${e.value_size} B</td>
                            <td class="muted">${new Date(e.updated_at * 1000).toLocaleString()}</td>
                            <td class="actions"><button class="btn btn-sm" onclick="event.stopPropagation();document.getElementById('mem-key').value='${escAttr(e.key)}';memGet()">View</button></td>
                        </tr>`).join('')
                    : `<tr><td colspan="5" class="muted">no entries</td></tr>`;
            } catch (e) {
                toast('memory.list failed: ' + e.message, 'err');
            }
        }

        async function memGet() {
            const key = document.getElementById('mem-key').value.trim();
            if (!key) return;
            try {
                const r = await grim('memory.get', { workspace_id: currentWorkspaceId, key });
                document.getElementById('mem-value').value = typeof r.value === 'string'
                    ? r.value : JSON.stringify(r.value, null, 2);
                toast('version ' + r.version, 'ok');
            } catch (e) {
                toast('memory.get failed: ' + e.message, 'err');
            }
        }

        async function memPut() {
            const key = document.getElementById('mem-key').value.trim();
            const raw = document.getElementById('mem-value').value;
            if (!key) { toast('key is required', 'err'); return; }
            let value;
            try { value = JSON.parse(raw); } catch { value = raw; }
            try {
                const r = await grim('memory.put', { workspace_id: currentWorkspaceId, key, value });
                toast('put → version ' + r.version, 'ok');
                memList();
            } catch (e) {
                toast('memory.put failed: ' + e.message, 'err');
            }
        }

        async function memDelete() {
            const key = document.getElementById('mem-key').value.trim();
            if (!key) return;
            if (!confirm(`Delete key ${key}?`)) return;
            try {
                await grim('memory.delete', { workspace_id: currentWorkspaceId, key });
                toast('deleted', 'ok');
                document.getElementById('mem-value').value = '';
                memList();
            } catch (e) {
                toast('memory.delete failed: ' + e.message, 'err');
            }
        }

        // --- Health page -------------------------------------------------
        // Aggregates daemon.status + agent.queue.list + budget.list +
        // /metrics scrape. /metrics is Prometheus text — we surface a few
        // headline numbers and expose the full body in a <details> block.
        function formatUptime(secs) {
            const d = Math.floor(secs / 86400);
            const h = Math.floor((secs % 86400) / 3600);
            const m = Math.floor((secs % 3600) / 60);
            return [d && (d + 'd'), h && (h + 'h'), m && (m + 'm')].filter(Boolean).join(' ') || (secs + 's');
        }

        function statTile(label, value, sub) {
            return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;min-width:9rem;flex:1">
                <div class="muted" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em">${esc(label)}</div>
                <div style="font-size:1.4rem;margin-top:0.3rem">${esc(String(value))}</div>
                ${sub ? `<div class="muted" style="font-size:0.75rem;margin-top:0.2rem">${esc(sub)}</div>` : ''}
            </div>`;
        }

        async function refreshHealth() {
            try {
                const s = await grim('daemon.status', {});
                document.getElementById('health-tiles').innerHTML = [
                    statTile('Daemon', s.daemon_id ? 'grimd-' + s.daemon_id : '—', 'id'),
                    statTile('Uptime', formatUptime(s.uptime_secs || 0)),
                    statTile('Agents', s.agent_count || 0, `${s.active_count || 0} active · ${s.queued_count || 0} queued`),
                    statTile('Concurrency', s.max_concurrent_agents || 0, 'max concurrent'),
                ].join('');
            } catch (e) {
                document.getElementById('health-tiles').innerHTML = `<div class="muted">daemon.status failed: ${esc(e.message)}</div>`;
            }

            try {
                const q = await grim('agent.queue.list', {});
                const entries = q.entries || q.queue || [];
                const tbody = document.getElementById('queue-tbody');
                tbody.innerHTML = entries.length
                    ? entries.map(e => `
                        <tr>
                            <td><code>${esc((e.id||'').slice(0,12))}</code></td>
                            <td><span class="badge">${esc(e.lane||'')}</span></td>
                            <td class="muted">${formatAge(e.age_seconds||0)}</td>
                            <td>${esc(e.provider||'')}</td>
                            <td>${esc(e.model||'')}</td>
                            <td>${e.block_reason ? '<span style="color:var(--red)">'+esc(e.block_reason)+'</span>' : '<span class="muted">—</span>'}</td>
                            <td><code style="font-family:inherit">${esc((e.task_text||'').slice(0,60))}</code></td>
                        </tr>`).join('')
                    : `<tr><td colspan="7" class="muted" style="text-align:center;padding:1rem">queue empty</td></tr>`;
            } catch (e) {
                document.getElementById('queue-tbody').innerHTML = `<tr><td colspan="7" class="muted">queue.list failed: ${esc(e.message)}</td></tr>`;
            }

            try {
                const b = await grim('budget.list', {});
                const tbody = document.getElementById('budget-tbody');
                const budgets = b.budgets || [];
                tbody.innerHTML = budgets.length
                    ? budgets.map(x => {
                        const pct = x.daily_usd > 0 ? (x.spent_usd / x.daily_usd) * 100 : 0;
                        const barColor = pct >= 90 ? 'var(--red)' : pct >= 70 ? 'var(--yellow)' : 'var(--green)';
                        return `
                        <tr>
                            <td>${esc(x.name)}</td>
                            <td>$${(x.spent_usd||0).toFixed(2)} / $${(x.daily_usd||0).toFixed(2)}</td>
                            <td><div style="background:var(--surface2);height:8px;border-radius:4px;overflow:hidden;width:120px"><div style="background:${barColor};height:100%;width:${Math.min(100, pct).toFixed(0)}%"></div></div></td>
                            <td class="muted">${(x.providers||[]).map(esc).join(', ')}</td>
                            <td>${x.hard ? '<span class="badge" style="background:rgba(248,113,113,0.15);color:var(--red)">hard</span>' : '<span class="badge">soft</span>'}</td>
                        </tr>`;
                    }).join('')
                    : `<tr><td colspan="5" class="muted">no budgets configured (day ${esc(b.day||'')})</td></tr>`;
            } catch (e) {
                document.getElementById('budget-tbody').innerHTML = `<tr><td colspan="5" class="muted">budget.list failed: ${esc(e.message)}</td></tr>`;
            }

            // /metrics is a Prometheus text exposition — fetch raw and show.
            try {
                const res = await fetch('/metrics');
                const text = await res.text();
                document.getElementById('metrics-raw').textContent = text;
            } catch (e) {
                document.getElementById('metrics-raw').textContent = 'fetch /metrics failed: ' + e.message;
            }
        }

        async function submitScrollInscribe() {

            if (maxc) params.max_concurrency = parseInt(maxc, 10);
            try {
                const r = await grim('scroll.inscribe', params);
                toast(`inscribed ${r?.id || ''} (${r?.task_count || 0} tasks)`, 'ok');
                document.getElementById('scroll-spec').value = '';
                refreshScrollsList();
            } catch (e) {
                toast('scroll.inscribe failed: ' + e.message, 'err');

                Complete: 'var(--green)', Active: 'var(--yellow)', Failed: 'var(--red)',

        async function showScrollDetail(id) {

                    <tr>
                        <td><code>${esc(t.task.name)}</code></td>
                        <td><span style="color:${taskStateColor(t.task.state)}">${esc(t.task.state)}</span></td>

                        <td class="muted">${esc(t.task.model || '')}</td>
                        <td><code style="font-family:inherit">${esc((t.task.prompt || '').slice(0, 60))}</code></td>

                const conflicts = (s.conflicts || []).length
                    ? `<div class="card" style="border-color:var(--red)"><h3 style="color:var(--red)">Conflicts</h3><pre>${esc(JSON.stringify(s.conflicts, null, 2))}</pre></div>`

                el.innerHTML = `

        // --- Mail page ---------------------------------------------------
        // The mail bus is agent-scoped: mail.list needs an agent_id. We pick
        // an "inbox agent" from the dropdown and the rest of the panel
        // operates against that agent. mail.send `to` accepts either an
        // agent id or `topic:<name>` for topic broadcasts.
        let currentMailAgent = null;

        async function refreshMailAgents() {
            const sel = document.getElementById('mail-agent');
            if (!sel) return;
            try {
                const result = await grim('agent.circle', {});
                const agents = result.agents || [];
                const cur = sel.value;
                sel.innerHTML = agents.length
                    ? agents.map(a => `<option value="${escAttr(a.id)}">${esc(a.id)} — ${esc((a.task||'').slice(0,60))}</option>`).join('')
                    : `<option value="">no agents</option>`;
                if (cur && agents.some(a => a.id === cur)) sel.value = cur;
                currentMailAgent = sel.value || null;
            } catch (e) {
                sel.innerHTML = `<option value="">agent.circle failed</option>`;
            }
        }

        async function refreshMailInbox() {
            currentMailAgent = document.getElementById('mail-agent').value;
            const tbody = document.getElementById('mail-tbody');
            if (!tbody || !currentMailAgent) return;
            const state = document.getElementById('mail-filter-state').value;
            const params = { agent_id: currentMailAgent, limit: 100 };
            if (state) params.state = state;
            try {
                const r = await grim('mail.list', params);
                renderMailTable(r.mails || []);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="muted">mail.list failed: ${esc(e.message)}</td></tr>`;
            }
        }

        function mailStateColor(s) {
            return ({
                Pending: 'var(--yellow)',
                Delivered: 'var(--green)',
                Failed: 'var(--red)',
                Acked: 'var(--blue)',
            })[s] || 'var(--text-dim)';
        }

        function renderMailTable(mails) {
            const tbody = document.getElementById('mail-tbody');
            if (!mails.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="muted" style="text-align:center;padding:2rem">inbox empty</td></tr>`;
                return;
            }
            tbody.innerHTML = mails.map(m => {
                const preview = (m.body || '').slice(0, 80);
                const from = m.sender_id ? esc(m.sender_id.slice(0, 8)) : '<span class="muted">—</span>';
                const topic = m.topic ? `<span class="badge badge-mail">${esc(m.topic)}</span>` : '';
                const reply = m.in_reply_to ? `<div class="muted" style="font-size:0.7rem">↳ ${esc(m.in_reply_to.slice(0,12))}</div>` : '';
                return `
                    <tr>
                        <td><code>${esc(m.id.slice(0,12))}</code>${reply}</td>
                        <td>${from}</td>
                        <td>${topic}</td>
                        <td><code style="font-family:inherit">${esc(preview)}</code></td>
                        <td><span style="color:${mailStateColor(m.state)}">${esc(m.state)}</span><div class="muted" style="font-size:0.7rem">${new Date(m.created_at*1000).toLocaleString()}</div></td>
                        <td class="actions">
                            <button class="btn btn-sm" onclick="openMailView('${escAttr(m.id)}', ${JSON.stringify(m.body).replace(/'/g, '&#39;')}, '${escAttr(m.sender_id||'')}', '${escAttr(m.topic||'')}', '${escAttr(m.in_reply_to||'')}')">Open</button>
                            <button class="btn btn-sm" onclick="ackMail('${escAttr(m.id)}')">Ack</button>
                        </td>
                    </tr>`;
            }).join('');
        }

        function openMailView(id, body, sender, topic, inReplyTo) {
            openModal(`
                <h2>Mail ${esc(id)}</h2>
                <div class="muted" style="font-size:0.8rem;margin-bottom:0.5rem">
                    from: <code>${esc(sender || '—')}</code>
                    ${topic ? ' · topic: <code>' + esc(topic) + '</code>' : ''}
                    ${inReplyTo ? ' · reply to: <code>' + esc(inReplyTo) + '</code>' : ''}
                </div>
                <pre>${esc(body)}</pre>
                <h2 style="margin-top:1.5rem">Reply</h2>
                <textarea id="reply-body" rows="4" placeholder="reply body…" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0.6rem;color:var(--text);font-family:inherit;font-size:0.85rem;resize:vertical"></textarea>
                <div class="modal-actions">
                    <button class="btn btn-sm" style="background:var(--surface2);color:var(--text)" onclick="closeModal()">Close</button>
                    <button class="btn" onclick="replyToMail('${escAttr(id)}', '${escAttr(sender)}')">Send reply</button>
                </div>
            `);
        }

        async function replyToMail(in_reply_to, to) {
            const body = document.getElementById('reply-body').value;
            if (!body.trim()) { toast('reply body is empty', 'err'); return; }
            if (!to) { toast('original mail has no sender to reply to', 'err'); return; }
            try {
                await grim('mail.send', { to, body, sender: currentMailAgent, in_reply_to });
                toast('reply sent', 'ok');
                closeModal();
                refreshMailInbox();
            } catch (e) {
                toast('mail.send failed: ' + e.message, 'err');
            }
        }

            try {
                await grim('mail.ack', { mail_id });

                toast('mail.ack failed: ' + e.message, 'err');
            }

            const to = document.getElementById('mail-to').value.trim();
            const body = document.getElementById('mail-body').value;
            if (!to || !body.trim()) { toast('to and body are required', 'err'); return; }
            try {
                const r = await grim('mail.send', { to, body, sender: currentMailAgent });
                toast(`sent → ${r.delivered} recipient${r.delivered===1?'':'s'}`, 'ok');
                document.getElementById('mail-body').value = '';
                refreshMailInbox();
            } catch (e) {
                toast('mail.send failed: ' + e.message, 'err');

        // --- Chronicle page ---------------------------------------------
        // Replay viewer: enter an agent id, get the full timeline of stored
        // events (agent.replay → ReplayResponse { entries: [{seq,kind,ts,event}] }).
        function chronicleKindColor(k) {
            return ({
                AgentCreated:'var(--blue)', StateChange:'var(--yellow)',
                Output:'var(--text-dim)', MailReceived:'var(--purple)',
                MailSent:'var(--purple)', WakeSourceFired:'var(--green)',
                Restarted:'var(--yellow)', Escalated:'var(--red)',
                Notification:'var(--accent)',
            })[k] || 'var(--text-dim)';
        }

        function chronicleSummary(ev) {
            // ev is a tagged enum object — most variants have a `type` field
            // adjacent to fields. Stringify what's interesting per kind.
            if (!ev || typeof ev !== 'object') return '';
            const t = ev.type || Object.keys(ev)[0];
            const inner = ev[t] || ev;
            try {
                if (t === 'Output' && inner.line) return (inner.stream||'stdout') + ': ' + String(inner.line).slice(0, 140);
                if (t === 'StateChange') return (inner.old_state||'?') + ' → ' + (inner.new_state||'?');
                if (t === 'MailReceived' || t === 'MailSent') return (inner.subject || inner.body || '').toString().slice(0, 120);
                if (t === 'AgentCreated' && inner.agent) return (inner.agent.task||'').slice(0,140);
                if (t === 'Notification') return (inner.summary||inner.title||'').toString().slice(0, 120);
                return JSON.stringify(inner).slice(0, 140);
            } catch { return ''; }
        }

        async function loadChronicle() {
            const id = document.getElementById('chron-id').value.trim();
            const body = document.getElementById('chron-body');
            if (!id) { toast('agent id required', 'err'); return; }
            body.innerHTML = '<div class="muted">loading…</div>';
            try {
                const r = await grim('agent.replay', { id });
                const entries = r.entries || [];
                if (!entries.length) { body.innerHTML = '<div class="muted">no events recorded</div>'; return; }
                body.innerHTML = `
                    <div class="muted" style="margin-bottom:0.75rem">${entries.length} event${entries.length===1?'':'s'} · agent <code>${esc(r.agent_id||id)}</code></div>
                    <table class="grid-table">
                        <thead><tr><th>#</th><th>Time</th><th>Kind</th><th>Detail</th></tr></thead>
                        <tbody>${entries.map(e => `
                            <tr>
                                <td class="muted">${e.seq}</td>
                                <td class="muted" style="font-size:0.75rem">${new Date(e.ts*1000).toLocaleString()}</td>
                                <td><span style="color:${chronicleKindColor(e.kind)}">${esc(e.kind||'')}</span></td>
                                <td><code style="font-family:inherit">${esc(chronicleSummary(e.event))}</code></td>
                            </tr>`).join('')}</tbody>
                    </table>
                `;
            } catch (e) {
                body.innerHTML = `<div class="muted">agent.replay failed: ${esc(e.message)}</div>`;
            }
        }

        function renderChroniclePage(rest) {

                el.innerHTML = `
                    <div class="card">

        // --- Webhooks page ----------------------------------------------
        // Inbound HTTP endpoints — `POST /webhooks/<name>` becomes mail to a

        // file (operator-managed); we only list them here.
        async function refreshWebhooks() {
            const tbody = document.getElementById('webhook-tbody');
            if (!tbody) return;
            try {

                const hooks = r.webhooks || [];

                    return;
                }
                const base = location.origin;
                tbody.innerHTML = hooks.map(h => {
                    const target = h.topic ? `topic:<code>${esc(h.topic)}</code>` : (h.recipient ? `agent:<code>${esc(h.recipient)}</code>` : '<span class="muted">unset</span>');

                        ? '<span class="badge" style="background:rgba(74,222,128,0.15);color:var(--green)">token</span>'

        async function testWebhook(name) {
            openModal(`
                <h2>Test POST → /webhooks/${esc(name)}</h2>
                <div class="form-grid" style="grid-template-columns:90px 1fr">

        async function sendWebhookTest(name) {

        function renderWebhooksPage() {
            const el = document.querySelector('[data-page="webhooks"]');
            if (!el.dataset.rendered) {
                el.innerHTML = `
                    <div class="card">
                        <h3>Inbound webhooks</h3>
                        <p class="muted" style="font-size:0.8rem;margin-bottom:0.75rem">
                            Webhook endpoints are defined in the daemon config under <code>[webhooks.&lt;name&gt;]</code>. Each one POSTs the raw request body into the mail bus as a message to its configured <code>topic</code> or <code>recipient</code>. Restart the daemon to pick up edits.
                        </p>
                        <table class="grid-table">
                            <thead><tr><th>Name</th><th>URL</th><th>Target</th><th>Auth</th><th></th></tr></thead>
                            <tbody id="webhook-tbody"></tbody>

        const agentsEl = document.getElementById('agents');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const listView = document.getElementById('list-view');
        const detailView = document.getElementById('detail-view');
        const breadcrumb = document.getElementById('breadcrumb');
        const detailTitle = document.getElementById('detail-title');
        const detailMeta = document.getElementById('detail-meta');
        const detailActions = document.getElementById('detail-actions');
        const agentOutput = document.getElementById('agent-output');
        const invokeSection = document.getElementById('invoke-section');

        let currentAgentId = null;
        let currentAgentState = null;
        let agentSSE = null;

        // Per-agent latest activity for list view live preview
        const agentLatestLine = {};

        function formatAge(secs) {
            if (secs < 60) return secs + 's';
            if (secs < 3600) return Math.floor(secs / 60) + 'm';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h';
            return Math.floor(secs / 86400) + 'd';
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Extract a short human-readable summary from a stream-json line
        function summarizeLine(jsonLine) {
            try {
                const v = JSON.parse(jsonLine);
                switch (v.type) {
                    case 'system':
                        return `◆ ${v.model || 'unknown'} starting...`;
                    case 'assistant': {
                        const content = v.message?.content;
                        if (!Array.isArray(content)) return null;
                        const parts = [];
                        for (const b of content) {
                            if (b.type === 'text') {
                                const t = (b.text || '').trim();
                                if (t) parts.push(t.slice(0, 150));
                            }
                            if (b.type === 'tool_use') {
                                const inp = b.input || {};
                                let detail = '';
                                switch (b.name) {
                                    case 'Bash':
                                        detail = inp.command ? `: ${inp.command}` : ''; break;
                                    case 'Read': case 'Write': case 'Edit':
                                        detail = inp.file_path ? `: ${inp.file_path.split('/').pop()}` : ''; break;
                                    case 'Glob': case 'Grep':
                                        detail = inp.pattern ? `: ${inp.pattern}` : ''; break;
                                    default:
                                        break;
                                }
                                parts.push(`▸ ${b.name}${detail}`);
                            }
                        }
                        return parts.length ? parts.join(' · ').slice(0, 200) : null;
                    }
                    case 'result': {
                        const dur = v.duration_ms || 0;
                        const durStr = dur > 60000 ? (dur/60000).toFixed(1) + 'm' : (dur/1000).toFixed(1) + 's';
                        const cost = v.total_cost_usd;
                        let s = v.subtype === 'success' ? '✓ complete' : '✗ ' + (v.subtype || 'error');
                        s += ` in ${durStr}`;
                        if (cost != null) s += ` · $${cost.toFixed(4)}`;
                        return s;
                    }
                    default:
                        return null;
                }
            } catch { return null; }
        }

        // --- Summon ---

        async function doSummon() {
            const input = document.getElementById('summon-input');
            const btn = document.getElementById('summon-btn');
            const task = input.value.trim();
            if (!task) return;
            btn.disabled = true;
            btn.textContent = 'Summoning...';
            try {
                const res = await fetch('/api/agents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const data = await res.json();
                if (data.id) { input.value = ''; fetchAgents(); showAgent(data.id); }
            } catch (e) {}
            btn.disabled = false;
            btn.textContent = 'Summon';
        }

        async function doBanish() {
            if (!currentAgentId) return;
            try { await fetch(`/api/agents/${currentAgentId}`, { method: 'DELETE' }); } catch (e) {}
        }

        async function doInvoke() {
            const input = document.getElementById('invoke-input');
            const btn = document.getElementById('invoke-btn');
            const message = input.value.trim();
            if (!message || !currentAgentId) return;
            btn.disabled = true;
            btn.textContent = 'Invoking...';
            try {
                const res = await fetch('/api/agents/' + currentAgentId + '/invoke', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (!data.error) { input.value = ''; updateDetailActions('active'); }
            } catch (e) {}
            btn.disabled = false;
            btn.textContent = 'Invoke';
        }

        // --- List view ---

        function renderAgents(agents) {
            if (!agents.length) {
                agentsEl.innerHTML = '<div class="empty"><div class="icon">&#x2728;</div><div>No agents summoned yet</div></div>';
                return;
            }
            agentsEl.innerHTML = agents.map(a => {
                const latest = agentLatestLine[a.id];
                const isLive = a.state === 'active' || a.state === 'summoning';
                const liveHtml = isLive && latest
                    ? `<div class="agent-card-live"><div class="live-label">● live</div>${esc(latest)}</div>`
                    : (latest && a.state === 'complete'
                        ? `<div class="agent-card-live" style="color:var(--blue)">${esc(latest)}</div>`
                        : '');
                return `
                    <div class="agent-card" onclick="showAgent('${esc(a.id)}')">
                        <div class="agent-card-top">
                            <span class="agent-id">${esc(a.id)}</span>
                            <span class="agent-state state-${esc(a.state)}">${esc(a.state)}</span>
                            <span class="agent-task">${esc(a.task || '-')}</span>
                            <span class="agent-age">${formatAge(a.age_secs)}</span>
                        </div>
                        ${liveHtml}
                    </div>`;
            }).join('');
        }

        async function fetchAgents() {
            try {
                const res = await fetch('/api/agents');
                const data = await res.json();
                renderAgents(data.agents || []);
            } catch (e) {}
        }

        // --- Detail view ---

        function updateDetailActions(state) {
            currentAgentState = state;
            let html = '';
            if (state === 'active' || state === 'summoning') {
                html = `<button class="btn btn-danger btn-sm" onclick="doBanish()">Banish</button>`;
                invokeSection.style.display = 'none';
            } else if (state === 'complete' || state === 'failed') {
                invokeSection.style.display = '';
            } else {
                invokeSection.style.display = 'none';
            }
            detailActions.innerHTML = html;
        }

        function showList() {
            currentAgentId = null;
            currentAgentState = null;
            if (agentSSE) { agentSSE.close(); agentSSE = null; }
            listView.style.display = '';
            detailView.style.display = 'none';
            breadcrumb.textContent = '';
            fetchAgents();
        }

        async function showAgent(id) {
            currentAgentId = id;
            listView.style.display = 'none';
            detailView.style.display = 'block';
            agentOutput.innerHTML = '';
            invokeSection.style.display = 'none';
            detailActions.innerHTML = '';

            try {
                const res = await fetch(`/api/agents/${id}`);
                const agent = await res.json();
                breadcrumb.textContent = `/ ${id}`;
                detailTitle.textContent = agent.task || id;
                detailMeta.innerHTML = `
                    <span class="agent-state state-${esc(agent.state)}" style="font-size:0.75rem">${esc(agent.state)}</span>
                    <span>${esc(id)}</span>
                    <span>${esc(agent.model || '')}</span>
                `;
                updateDetailActions(agent.state);
            } catch (e) {
                detailTitle.textContent = id;
            }

            // Load history
            try {
                const res = await fetch(`/api/agents/${id}/history`);
                const events = await res.json();
                if (Array.isArray(events)) {
                    for (const ev of events) {
                        if (ev.event_type === 'stdout') renderStreamEvent(ev.payload);
                    }
                }
            } catch (e) {}

            // SSE for live updates (streams new output in real-time)
            if (agentSSE) agentSSE.close();
            agentSSE = new EventSource(`/api/agents/${id}/events`);
            agentSSE.onmessage = (e) => {
                try {
                    const event = JSON.parse(e.data);
                    if (event.type === 'output' && event.stream === 'stdout') {
                        renderStreamEvent(event.line);
                    } else if (event.type === 'state_change') {
                        const badge = detailMeta.querySelector('.agent-state');
                        if (badge) {
                            badge.className = `agent-state state-${event.new_state}`;
                            badge.textContent = event.new_state;
                        }
                        updateDetailActions(event.new_state);
                    }
                } catch (err) {}
            };
        }

        // --- Stream-JSON parser (formatted rendering) ---

        function renderStreamEvent(jsonLine) {
            let v;
            try { v = JSON.parse(jsonLine); } catch { return; }
            switch (v.type) {
                case 'system': renderInit(v); break;
                case 'assistant': renderAssistant(v); break;
                case 'user': renderUser(v); break;
                case 'tool_use': renderToolUse(v); break;
                case 'tool_result': renderToolResult(v); break;
                case 'result': renderResult(v); break;
            }
            agentOutput.scrollTop = agentOutput.scrollHeight;
        }

        function renderInit(v) {
            const el = document.createElement('div');
            el.className = 'ev-init';
            el.textContent = `◆ ${v.model || 'unknown'}  session ${(v.session_id || '').slice(0, 8)}`;
            agentOutput.appendChild(el);
        }

        function renderAssistant(v) {
            const content = v.message?.content;
            if (!Array.isArray(content)) return;
            for (const block of content) {
                if (block.type === 'text') {
                    const text = (block.text || '').trim();
                    if (!text) continue;
                    const el = document.createElement('div');
                    el.className = 'ev-text';
                    el.textContent = text;
                    agentOutput.appendChild(el);
                } else if (block.type === 'tool_use') {
                    appendToolUse(block.name, block.input);
                }
            }
        }

        function renderUser(v) {
            const content = v.message?.content;
            if (!Array.isArray(content)) return;
            for (const block of content) {
                if (block.type === 'tool_result') {
                    const el = document.createElement('div');
                    el.className = 'ev-tool-result' + (block.is_error ? ' error' : '');
                    let text = '';
                    if (typeof block.content === 'string') text = block.content;
                    else if (Array.isArray(block.content))
                        text = block.content.filter(c => c.type === 'text').map(c => c.text || '').join('\n');
                    const lines = text.split('\n');
                    el.textContent = lines.length > 20
                        ? lines.slice(0, 15).join('\n') + `\n... (${lines.length} lines)` : text;
                    agentOutput.appendChild(el);
                }
            }
        }

        function renderToolUse(v) { appendToolUse(v.name, v.input); }

        function appendToolUse(name, input) {
            const el = document.createElement('div');
            el.className = 'ev-tool';
            let paramHtml = '';
            if (input) {
                switch (name) {
                    case 'Bash':
                        if (input.command) paramHtml = `<div class="tool-param">${esc(input.command)}</div>`;
                        break;
                    case 'Read': case 'Write': case 'Edit':
                        if (input.file_path) paramHtml = `<div class="tool-param">${esc(input.file_path)}</div>`;
                        break;
                    case 'Glob': case 'Grep':
                        if (input.pattern) paramHtml = `<div class="tool-param">${esc(input.pattern)}</div>`;
                        break;
                    default:
                        const keys = Object.keys(input);
                        if (keys.length) paramHtml = `<div class="tool-param">${esc(keys.join(', '))}</div>`;
                }
            }
            el.innerHTML = `<span class="tool-name">▸ ${esc(name)}</span>${paramHtml}`;
            agentOutput.appendChild(el);
        }

        function renderToolResult(v) {
            const el = document.createElement('div');
            el.className = 'ev-tool-result' + (v.is_error ? ' error' : '');
            const output = v.content || v.output || '';
            const lines = output.split('\n');
            el.textContent = lines.length > 20
                ? lines.slice(0, 15).join('\n') + `\n... (${lines.length} lines)` : output;
            agentOutput.appendChild(el);
        }

        function renderResult(v) {
            const el = document.createElement('div');
            el.className = 'ev-result';
            const ok = v.subtype === 'success';
            const dur = v.duration_ms || 0;
            const durStr = dur > 60000 ? (dur/60000).toFixed(1) + 'm' : (dur/1000).toFixed(1) + 's';
            const turns = v.num_turns || 0;
            const cost = v.total_cost_usd;
            let html = ok
                ? `<span class="success">✓ success</span>`
                : `<span class="failure">✗ ${esc(v.subtype || 'error')}</span>`;
            html += `<span class="meta">${durStr} · ${turns} turn${turns===1?'':'s'}`;
            if (cost != null) html += ` · $${cost.toFixed(4)}`;
            html += `</span>`;
            el.innerHTML = html;
            agentOutput.appendChild(el);
        }

        // --- Global SSE ---
        // One EventSource pushes daemon events to every page. Per-page
        // handlers below are debounced so a burst of events triggers one
        // refresh, not N. Pages register interest by event-type prefix.
        const sseHandlers = {};   // event-type → [fn(event)]
        const debouncers = {};    // key → timer id

        function onSse(type, fn) {
            (sseHandlers[type] ||= []).push(fn);
        }

        function refreshSoon(key, fn, delay) {
            clearTimeout(debouncers[key]);
            debouncers[key] = setTimeout(fn, delay ?? 300);
        }

        function pageVisible(name) {
            const el = document.querySelector(`[data-page="${name}"]`);
            return el && !el.hidden;
        }

        // Wire built-in page reactions. Each handler short-circuits when its
        // page isn't visible to avoid wasted RPCs.
        onSse('output', (ev) => {
            if (ev.stream !== 'stdout') return;
            const summary = summarizeLine(ev.line);
            if (summary) {
                agentLatestLine[ev.agent_id] = summary;
                if (pageVisible('agents') && !currentAgentId) {
                    refreshSoon('agents', fetchAgents, 500);
                }
            }
        });
        onSse('state_change', () => {
            if (pageVisible('agents') && !currentAgentId) refreshSoon('agents', fetchAgents);
            if (pageVisible('health')) refreshSoon('health', refreshHealth, 500);
        });
        onSse('agent_created', () => {
            if (pageVisible('agents') && !currentAgentId) refreshSoon('agents', fetchAgents);
            if (pageVisible('health')) refreshSoon('health', refreshHealth, 500);
        });
        onSse('agent_queued', () => {
            if (pageVisible('health')) refreshSoon('health', refreshHealth, 300);
        });
        onSse('mail_received', () => { if (pageVisible('mail')) refreshSoon('mail', refreshMailInbox); });
        onSse('mail_sent',     () => { if (pageVisible('mail')) refreshSoon('mail', refreshMailInbox); });
        onSse('mail_delivered',() => { if (pageVisible('mail')) refreshSoon('mail', refreshMailInbox); });
        onSse('wake_source_registered', () => { if (pageVisible('wake')) refreshSoon('wake', refreshWake); });
        onSse('wake_source_fired',      () => { if (pageVisible('wake')) refreshSoon('wake', refreshWake); });
        onSse('wake_source_failed',     () => { if (pageVisible('wake')) refreshSoon('wake', refreshWake); });
        onSse('wake_source_retired',    () => { if (pageVisible('wake')) refreshSoon('wake', refreshWake); });
        onSse('workspace_created',   () => { if (pageVisible('workspaces')) refreshSoon('ws', refreshWorkspaces); });
        onSse('workspace_destroyed', () => { if (pageVisible('workspaces')) refreshSoon('ws', refreshWorkspaces); });
        onSse('scroll_progress',     () => { if (pageVisible('scrolls')) refreshSoon('scrolls', refreshScrollsList); });
        onSse('task_state_change',   () => {
            if (pageVisible('scrolls')) {
                const { rest } = parseHash();
                if (rest && rest[0]) refreshSoon('scrolldetail', () => showScrollDetail(rest[0]), 400);
                else refreshSoon('scrolls', refreshScrollsList);
            }
        });
        onSse('peer_handshake_ok',       () => { if (pageVisible('federation')) refreshSoon('peers', refreshPeers); });
        onSse('peer_handshake_failed',   () => { if (pageVisible('federation')) refreshSoon('peers', refreshPeers); });
        onSse('peer_stream_connected',   () => { if (pageVisible('federation')) refreshSoon('peers', refreshPeers); });
        onSse('peer_stream_disconnected',() => { if (pageVisible('federation')) refreshSoon('peers', refreshPeers); });

        function connectSSE() {
            const es = new EventSource('/api/events');
            es.onopen = () => {
                statusDot.style.background = 'var(--green)';
                statusText.textContent = 'connected';
            };
            es.onmessage = (e) => {
                let event;
                try { event = JSON.parse(e.data); } catch { return; }
                const handlers = sseHandlers[event.type];
                if (!handlers) return;
                for (const h of handlers) {
                    try { h(event); } catch (err) { console.warn('sse handler', event.type, err); }
                }
            };
            es.onerror = () => {
                statusDot.style.background = 'var(--red)';
                statusText.textContent = 'disconnected';
                es.close();
                setTimeout(connectSSE, 3000);
            };
        }

        route();
        setInterval(() => { if (parseHash().name === 'agents' && !currentAgentId) fetchAgents(); }, 10000);
        connectSSE();
        const _si = document.getElementById('summon-input');
        if (_si) _si.focus();
    </script>
</body>
</html>
